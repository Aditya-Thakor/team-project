<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        .sec1 {
    background: url(https://themewagon.github.io/Nova-Bootstrap5_beta1/assets/img/hero/hero-5/hero-bg.svg);
    height: 721.03px;
    background-repeat: no-repeat;
    object-fit: cover;
    background-size: cover;
    background-position: center;
}





.using {
    font-weight: 700;
    color: #323450;
    font-family: "fira sans", sans-serif;
    font-size: 55px;
    margin-top: 25%;
}

.using-p {
    font-size: 16px;
    color: #585978;
    font-family: sans-serif;
    margin-top: 9%;
    margin-bottom: 9%;
}

.cssbuttons-io-button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 30px !important;
    border-radius: 30px;
    background: transparent;
    color: #5468FF;
    font-size: 16px;
    font-weight: 600;
    border: 2px solid #5468FF;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    z-index: 1;
    transition: color 0.3s ease;
}


.cssbuttons-io-button::before {
    content: "";
    position: absolute;
    left: -100%;
    top: 0;
    width: 100%;
    height: 100%;
    background: #5468FF;
    transition: all 0.4s ease;
    z-index: -1;
}


.cssbuttons-io-button .icon {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #5468FF;
    color: #fff;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    transition: all 0.3s ease;
}

.cssbuttons-io-button svg {
    width: 18px;
    height: 18px;
}


.cssbuttons-io-button:hover::before {
    left: 0;
}

.cssbuttons-io-button:hover {
    color: #fff;
}


.cssbuttons-io-button:hover .icon {
    transform: rotate(360deg);
    background: #fff;
    color: #5468FF;
}


.cssbuttons-io-button:active {
    transform: scale(0.95);
}
    </style>
</head>
<body>
    <section class="sec1 position-relative">
        <div class="container">
            <div class="row" style="padding-top: 20%;">
                <div class="col-lg-6">
                    <div class="hero-content-wrapper">
                        <h2 class="using">You're Using Free Lite Version</h2>

                        <p class="using-p">Please purchase full version of the template to get all sections <br> and
                            permission to use with commercial projects.</p>

                        <button class="cssbuttons-io-button btn d-flex">
                            Get started
                            <div class="icon">
                                <i class="fa-solid fa-angle-right"></i>
                            </div>
                        </button>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="hero-img">
                        <img src="https://themewagon.github.io/Nova-Bootstrap5_beta1/assets/img/hero/hero-5/hero-img.svg" alt="" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../../../js/bootstrap.bundle.min.js"></script>
</body>
</html>
