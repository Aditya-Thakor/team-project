<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Project</title>
    <link rel="stylesheet" href="./contact.css">
    <link rel="stylesheet" href="../../../css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main-div ">
        <div class="container">
            <div class="row">
                <h1 class="hed-titel">Get in touch</h1>
                <p class="hed-stop">Stop wasting time and money designing and managing a <br> website that doesn’t get
                    results. Happiness guaranteed!</p>
            </div>
            <div class="col-lg-12 d-flex gap-4">
                <div class="col-lg-8">
                    <div class="contact-container">
                        <form action="#">
                            <div class="form-grid">
                                <!-- Row 1 -->
                                <div class="input-group">
                                    <i class="fa-regular fa-user"></i>
                                    <input type="text" placeholder="Name" required>
                                </div>
                                <div class="input-group">
                                    <i class="fa-regular fa-envelope"></i>
                                    <input type="email" placeholder="Email" required>
                                </div>

                                <!-- Row 2 -->
                                <div class="input-group">
                                    <i class="fa-solid fa-phone"></i>
                                    <input type="tel" placeholder="Number">
                                </div>
                                <div class="input-group">
                                    <i class="fa-solid fa-font"></i>
                                    <input type="text" placeholder="Subject">
                                </div>

                                <!-- Message Area -->
                                <div class="input-group full-width">
                                    <i class="fa-regular fa-file-lines"></i>
                                    <textarea placeholder="Message"></textarea>
                                </div>
                            </div>

                            <button type="submit" class="submit-btn">
                                <i class="fa-solid fa-paper-plane"></i> Submit
                            </button>
                        </form>
                    </div>
                </div>
                <div class="col-lg-4 h-100 d-flex flex-column justify-content-between gap-4 p-3">
                    <div class="CNcard1 mt-2 mb-2 d-flex justify-content-between">
                        <span class="contact"><i class="fa-solid fa-phone"></i></span>
                        <div class="">
                        0045939863784
                        +004389478327
                        </div>
                    </div>

                    <div class="CNcard1 mt-2 mb-2 d-flex justify-content-between">
                        <span class="contact "><i class="fa-solid fa-envelope"></i></span>
                        <div class="">
                    yourmail@gmail.com <br>
                    admin@yourwebsite.com
                    </div>
                    </div>

                    <div class="CNcard1 mt-2 mb-2 d-flex justify-content-between">
                        <span class="contact"><i class="fa-solid fa-location-dot"></i></span>
                        <div class="">
                      John's House, 13/5 Road, <br> Sidny United State Of <br> America
                      </div>
                    </div>

                </div>
            </div>
</body>

</html>
